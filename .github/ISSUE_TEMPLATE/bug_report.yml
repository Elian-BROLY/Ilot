name: Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Que se passe-t-il ?
      description: Ce que vous avez fait, ce que vous attendiez et ce qui s'est passé.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version d'Ilot
      description: Dans les réglages, onglet À propos.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Journal
      description: Le contenu de app.log (réglages, onglet À propos, Ouvrir le journal). Il ne contient que des erreurs techniques, relisez-le quand même avant de le publier.
      render: text
