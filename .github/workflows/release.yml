# Publier une version : git tag v1.6.0, puis git push origin v1.6.0.
# Le tag doit correspondre à <Version> dans Ilot.csproj.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Ilot.Tests/Ilot.Tests.csproj
      - name: Vérifier la version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $project = ([xml](Get-Content src/Ilot/Ilot.csproj)).Project.PropertyGroup.Version | Where-Object { $_ }
          if ($project -ne $version) { throw "Le tag $version ne correspond pas à la version du projet $project." }
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: dotnet publish src/Ilot/Ilot.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -o dist
      - run: dotnet tool restore
      # Récupère la version précédente pour que la mise à jour ne télécharge que la différence.
      - continue-on-error: true # Pas de version précédente lors de la toute première publication.
        run: dotnet tool run vpk -- download github --repoUrl ${{ env.REPO_URL }} --token ${{ env.TOKEN }} --outputDir installer
      - run: dotnet tool run vpk -- pack --packId Ilot --packVersion ${{ env.VERSION }} --packDir dist --mainExe Ilot.exe --packTitle Ilot --icon src/Ilot/Assets/Ilot.ico --framework net10.0-x64-desktop --outputDir installer
      - run: dotnet tool run vpk -- upload github --repoUrl ${{ env.REPO_URL }} --token ${{ env.TOKEN }} --outputDir installer --publish --releaseName "Ilot ${{ env.VERSION }}" --tag ${{ github.ref_name }}
