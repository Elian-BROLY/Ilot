server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; connect-src https://api.github.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Raccourci : /download renvoie vers l'installateur de la dernière version.
    location = /download {
        return 302 https://github.com/Elian-BROLY/Ilot/releases/latest/download/Ilot-win-Setup.exe;
    }

    location ~* \.(png|gif|svg)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
